name: "Reportes para el Estado de Contabilidad de la Configuración"

on:
  workflow_dispatch:
    inputs:
      filename:
        description: "Nombre del archivo (ej: CACIF-CPRAG.docx, PGC.docx)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  version-report:
    name: "📊 Generar reporte de versionado"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Buscar archivo y generar reporte
        shell: bash
        run: |
          FILENAME="${{ github.event.inputs.filename }}"

          echo "============================================"
          echo "🔍 DEBUG: Inicio del reporte de versionado"
          echo "============================================"
          echo "📌 Input filename: '$FILENAME'"
          echo "📌 Working directory: $(pwd)"
          echo "📌 Git branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "📌 Git HEAD: $(git rev-parse HEAD)"
          echo ""

          echo "Buscando '$FILENAME' en el repositorio..."

          # ── Buscar el archivo (excluyendo Linea Base) ──────────────
          echo "🔍 DEBUG: Ejecutando find..."
          echo "  Comando: find . -name \"$FILENAME\" -not -path './.git/*' -not -path '*/Linea Base/*'"
          MATCHES=$(find . -name "$FILENAME" -not -path './.git/*' -not -path '*/Linea Base/*' | sed 's|^\./||')
          MATCH_COUNT=$(echo "$MATCHES" | grep -c -v '^$' || true)

          echo "🔍 DEBUG: Resultados de find:"
          echo "  Match count: $MATCH_COUNT"
          echo "  Matches encontrados:"
          echo "$MATCHES" | while IFS= read -r m; do
            [ -z "$m" ] && continue
            echo "    - '$m'"
          done
          echo ""

          if [ "$MATCH_COUNT" -eq 0 ] || [ -z "$MATCHES" ]; then
            {
              echo "## ❌ Archivo no encontrado"
              echo ""
              echo "No se encontró ningún archivo con el nombre \`$FILENAME\` en el repositorio."
              echo ""
              echo "### Sugerencias"
              echo "- Verifica que el nombre esté escrito correctamente (incluyendo extensión)"
              echo "- El nombre es case-sensitive"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Si hay múltiples coincidencias, usar la primera
          FILE_PATH=$(echo "$MATCHES" | head -1)

          if [ "$MATCH_COUNT" -gt 1 ]; then
            echo "⚠️ Se encontraron $MATCH_COUNT coincidencias. Usando: $FILE_PATH"
            echo ""
            echo "Todas las coincidencias:"
            echo "$MATCHES"
            echo ""
          fi

          echo "📌 Archivo seleccionado: '$FILE_PATH'"
          echo ""

          # ── DEBUG: Verificar que el archivo existe en disco ────────
          echo "🔍 DEBUG: Verificando existencia del archivo en disco..."
          if [ -f "$FILE_PATH" ]; then
            echo "  ✅ El archivo existe en disco"
            echo "  Tamaño: $(stat --printf='%s bytes' "$FILE_PATH" 2>/dev/null || wc -c < "$FILE_PATH") "
          else
            echo "  ⚠️ El archivo NO existe en disco (podría haber sido eliminado)"
          fi
          echo ""

          # ── DEBUG: git log SIN --follow ────────────────────────────
          echo "============================================"
          echo "🔍 DEBUG: git log SIN --follow (solo commits directos)"
          echo "============================================"
          echo "  Comando: git log --format='%h|%an|%ae|%ad|%s' --date=format:'%d/%m/%Y|%H:%M' -- \"$FILE_PATH\""
          LOG_NO_FOLLOW=$(git log --format="%h|%an|%ae|%ad|%s" --date=format:"%d/%m/%Y|%H:%M" -- "$FILE_PATH")
          NO_FOLLOW_COUNT=$(echo "$LOG_NO_FOLLOW" | grep -c -v '^$' || echo 0)
          echo "  Total commits (sin follow): $NO_FOLLOW_COUNT"
          echo "  Datos raw:"
          echo "$LOG_NO_FOLLOW" | while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "    $line"
          done
          echo ""

          # ── DEBUG: git log CON --follow ────────────────────────────
          echo "============================================"
          echo "🔍 DEBUG: git log CON --follow (rastreando renombramientos)"
          echo "============================================"
          echo "  Comando: git log --follow --format='%h|%an|%ae|%ad|%s' --date=format:'%d/%m/%Y|%H:%M' -- \"$FILE_PATH\""
          LOG_WITH_FOLLOW=$(git log --follow --format="%h|%an|%ae|%ad|%s" --date=format:"%d/%m/%Y|%H:%M" -- "$FILE_PATH")
          WITH_FOLLOW_COUNT=$(echo "$LOG_WITH_FOLLOW" | grep -c -v '^$' || echo 0)
          echo "  Total commits (con follow): $WITH_FOLLOW_COUNT"
          echo "  Datos raw:"
          echo "$LOG_WITH_FOLLOW" | while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "    $line"
          done
          echo ""

          # ── DEBUG: Comparar ambos resultados ───────────────────────
          if [ "$NO_FOLLOW_COUNT" != "$WITH_FOLLOW_COUNT" ]; then
            echo "⚠️ DIFERENCIA DETECTADA: --follow agrega $((WITH_FOLLOW_COUNT - NO_FOLLOW_COUNT)) commits extra"
            echo "  Esto indica que git está rastreando renombramientos que podrían ser incorrectos."
            echo ""
            echo "🔍 DEBUG: Commits EXTRA que agrega --follow:"
            # Mostrar los commits que solo aparecen con --follow
            diff <(echo "$LOG_NO_FOLLOW" | cut -d'|' -f1 | sort) <(echo "$LOG_WITH_FOLLOW" | cut -d'|' -f1 | sort) | grep '^>' || echo "  (no se pudo calcular diff)"
            echo ""
          else
            echo "✅ Ambos métodos devuelven la misma cantidad de commits ($NO_FOLLOW_COUNT)"
            echo ""
          fi

          # ── DEBUG: Mostrar qué archivos tocó cada commit ───────────
          echo "============================================"
          echo "🔍 DEBUG: Archivos modificados por cada commit (con --follow)"
          echo "============================================"
          echo "$LOG_WITH_FOLLOW" | while IFS='|' read -r hash rest; do
            [ -z "$hash" ] && continue
            echo "  Commit $hash:"
            echo "    Mensaje: $(git log -1 --format='%s' "$hash")"
            echo "    Archivos modificados en este commit:"
            git diff-tree --no-commit-id -r --name-status "$hash" 2>/dev/null | while IFS=$'\t' read -r status fname; do
              echo "      [$status] $fname"
            done
            echo ""
          done
          echo ""

          # ── DEBUG: Detectar renombramientos con --follow --name-status
          echo "============================================"
          echo "🔍 DEBUG: Detección de renombramientos (--follow --name-status)"
          echo "============================================"
          echo "  Comando: git log --follow --name-status --format='COMMIT:%h|%s' -- \"$FILE_PATH\""
          git log --follow --name-status --format="COMMIT:%h|%s" -- "$FILE_PATH" | head -80
          echo ""
          echo "============================================"
          echo "🔍 DEBUG: Fin de la sección de depuración"
          echo "============================================"
          echo ""

          # ── Mapa de descripciones de ítems ─────────────────────────
          get_description() {
            local fname="$1"
            case "$fname" in
              # ── Análisis ──
              CACIF-PC.docx)    echo "Project Charter" ;;
              CACIF-MR.xlsx)    echo "Matriz de Requisitos" ;;
              CACIF-RNF.xlsx)   echo "Requisitos No Funcionales" ;;
              CACIF-DN.docx)    echo "Documento de Negocio" ;;
              CACIF-CU01.docx)  echo "Caso de Uso 01" ;;
              CACIF-CU02.docx)  echo "Caso de Uso 02" ;;
              CACIF-CU03.docx)  echo "Caso de Uso 03" ;;
              CACIF-CU04.docx)  echo "Caso de Uso 04" ;;
              # ── Diseño ──
              CACIF-DA.docx)    echo "Documento de Arquitectura" ;;
              CACIF-MD.docx)    echo "Modelo de Datos" ;;
              CACIF-EBC.docx)   echo "Especificación de la Base de Conocimiento" ;;
              CACIF-ELT.docx)   echo "Especificación de Logs y Trazabilidad" ;;
              CACIF-CPRAG.docx) echo "Catálogo de Prompts RAG" ;;
              CACIF-DI.docx)    echo "Diseño de Interfaz" ;;
              CACIF-PP.docx)    echo "Plan de Pruebas" ;;
              CACIF-CP.xlsx)    echo "Matriz de Casos de Prueba" ;;
              # ── Desarrollo / Pruebas ──
              CACIF-RE01.xlsx)  echo "Reporte de Ejecución 1" ;;
              CACIF-RE02.xlsx)  echo "Reporte de Ejecución 2" ;;
              # ── QA y Calidad ──
              CACIF-RMIA.xlsx)  echo "Reporte de Métricas de Inteligencia Artificial" ;;
              CACIF-IV.docx)    echo "Informe de Validación" ;;
              CACIF-BE.xlsx)    echo "Backlog de Errores" ;;
              CACIF-AAQA.docx)  echo "Acta de Aprobación de QA" ;;
              # ── Despliegue ──
              CACIF-MT.docx)    echo "Manual Técnico" ;;
              CACIF-MU.docx)    echo "Manual de Usuario" ;;
              CACIF-AC.docx)    echo "Acta de Cierre" ;;
              # ── Configuración ──
              PGC.docx)         echo "Plan de Gestión de Configuración" ;;
              *)                echo "$fname" ;;
            esac
          }

          DESCRIPTION=$(get_description "$FILENAME")

          # ── Obtener historial completo con git log ─────────────────
          # --follow para rastrear renombramientos
          # --diff-filter=ACDMR para incluir creación, copia, borrado, modificación, renombrado
          # Formato: hash|author|email|date|time|subject
          LOG_DATA=$(git log --follow --format="%h|%an|%ae|%ad|%s" --date=format:"%d/%m/%Y|%H:%M" -- "$FILE_PATH")

          if [ -z "$LOG_DATA" ]; then
            {
              echo "## ⚠️ Sin historial"
              echo ""
              echo "El archivo \`$FILENAME\` existe pero no tiene historial de commits."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Contar total de versiones
          TOTAL_VERSIONS=$(echo "$LOG_DATA" | wc -l)

          # ── Generar reporte ────────────────────────────────────────
          {
            echo "## 📋 Reporte de Versionado — \`$FILENAME\`"
            echo ""
            echo "> 📅 Generado el $(date -u +'%d/%m/%Y a las %H:%M UTC')"
            echo ""
            echo "---"
            echo ""
            echo "### 📄 Información del Ítem"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| **Código del ítem** | \`$FILENAME\` |"
            echo "| **Descripción** | $DESCRIPTION |"
            echo "| **Ruta en el repositorio** | \`/$FILE_PATH\` |"
            echo "| **Total de versiones** | **$TOTAL_VERSIONS** |"
            echo ""
            echo "---"
            echo ""
            echo "### 📊 Historial Completo de Versiones"
            echo ""
            echo "| Versión | Commit | Autor | Email | Fecha | Hora | Descripción del cambio |"
            echo "|---|---|---|---|---|---|---|"

            # Invertir el orden (más antiguo primero) para asignar versiones
            REVERSED=$(echo "$LOG_DATA" | tac)
            VERSION=1

            while IFS='|' read -r HASH AUTHOR EMAIL DATE TIME SUBJECT; do
              [ -z "$HASH" ] && continue
              echo "| **v${VERSION}.0** | \`$HASH\` | $AUTHOR | $EMAIL | $DATE | $TIME | $SUBJECT |"
              VERSION=$((VERSION + 1))
            done <<< "$REVERSED"

            echo ""
            echo "---"
            echo ""

            # Extraer datos de la versión actual (primer línea = más reciente)
            LATEST=$(echo "$LOG_DATA" | head -1)
            IFS='|' read -r L_HASH L_AUTHOR L_EMAIL L_DATE L_TIME L_SUBJECT <<< "$LATEST"

            echo "### ✅ Versión Actual"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| **Última versión** | **v$((TOTAL_VERSIONS)).0** |"
            echo "| **Último commit** | \`$L_HASH\` |"
            echo "| **Autor** | $L_AUTHOR |"
            echo "| **Email** | $L_EMAIL |"
            echo "| **Fecha** | $L_DATE |"
            echo "| **Hora** | $L_TIME |"
            echo "| **Descripción** | $L_SUBJECT |"
            echo ""
            echo "---"
            echo ""
            echo "<sub>🤖 Bot de Choclicode · Workflow: Reporte de Versionado</sub>"

          } >> "$GITHUB_STEP_SUMMARY"

          echo "✅ Reporte generado exitosamente para '$FILENAME' ($TOTAL_VERSIONS versiones)"
