name: "🚀 CD — Deploy a Produccion"

on:
  push:
    branches:
      - main

concurrency:
  group: cd-${{ github.sha }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Backend: Unit Tests
  # ═══════════════════════════════════════════════════════════════
  backend-tests:
    name: "🐍 Backend — Unit Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Desarrollo/CACIF/Codigo Fuente/Backend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "Desarrollo/CACIF/Codigo Fuente/Backend/requirements.txt"

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir pytest-asyncio httpx

      - name: ✅ Verificar sintaxis Python
        run: |
          python -m py_compile app/main.py
          python -m py_compile app/config.py
          python -m py_compile app/schemas.py
          python -m py_compile app/models.py
          python -m py_compile app/dependencies.py
          python -m py_compile app/routes/auth.py
          python -m py_compile app/routes/chat.py
          python -m py_compile app/routes/kb.py

      - name: 🔗 Verificar imports
        run: python -c "from app.main import app; print('✓ App imports correctamente')"

      - name: 🧪 Ejecutar tests unitarios
        run: |
          pytest tests/test_config.py tests/test_schemas.py tests/test_auth.py tests/test_health.py -v --tb=short
        env:
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test"
          JWT_SECRET: "ci-test-secret-key"
          GEMINI_API_KEY: "fake-key-for-ci"
          AZURE_SEARCH_ENDPOINT: "https://fake.search.windows.net"
          AZURE_SEARCH_API_KEY: "fake-key-for-ci"
          AWS_ACCESS_KEY_ID: "fake"
          AWS_SECRET_ACCESS_KEY: "fake"
          UPSTASH_REDIS_URL: "https://fake.upstash.io"
          UPSTASH_REDIS_TOKEN: "fake"

  # ═══════════════════════════════════════════════════════════════
  # Frontend: Lint + Type Check + Unit Tests
  # ═══════════════════════════════════════════════════════════════
  frontend-checks:
    name: "⚛️ Frontend — Lint & Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Desarrollo/CACIF/Codigo Fuente/Frontend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📗 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "Desarrollo/CACIF/Codigo Fuente/Frontend/package-lock.json"

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔍 ESLint
        run: npm run lint

      - name: 🏷️ TypeScript — Verificar tipos
        run: npx tsc --noEmit

      - name: 🧪 Vitest — Tests unitarios
        run: npm run test

  # ═══════════════════════════════════════════════════════════════
  # Deploy Frontend: Vercel (solo si los tests pasan)
  # ═══════════════════════════════════════════════════════════════
  deploy-frontend:
    name: "🌐 Deploy Frontend — Vercel"
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📗 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "Desarrollo/CACIF/Codigo Fuente/Frontend/package-lock.json"

      - name: 📦 Instalar Vercel CLI
        run: npm install -g vercel

      - name: 🔗 Pull configuracion de Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: Desarrollo/CACIF/Codigo Fuente/Frontend

      - name: 🏗️ Build de produccion
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: Desarrollo/CACIF/Codigo Fuente/Frontend

      - name: 🚀 Deploy a produccion
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: Desarrollo/CACIF/Codigo Fuente/Frontend

  # ═══════════════════════════════════════════════════════════════
  # Deploy Backend: Render (solo si los tests pasan)
  # ═══════════════════════════════════════════════════════════════
  deploy-backend:
    name: "🖥️ Deploy Backend — Render"
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]

    steps:
      - name: 🚀 Trigger deploy en Render
        run: |
          curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" | grep -q "200\|2[0-9][0-9]"
          echo "✓ Deploy triggered en Render"
