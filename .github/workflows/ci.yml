name: "🔒 CI — Pull Request"

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Backend: Full Test Suite (Unit + Integration)
  # ═══════════════════════════════════════════════════════════════
  backend-full:
    name: "🐍 Backend — Full Test Suite"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Desarrollo/CACIF/Codigo Fuente/Backend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "Desarrollo/CACIF/Codigo Fuente/Backend/requirements.txt"

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx

      - name: ✅ Verificar sintaxis de todos los módulos Python
        run: |
          find app -name "*.py" -exec python -m py_compile {} +
          find services -name "*.py" -exec python -m py_compile {} +

      - name: 🧪 Ejecutar test suite completo
        id: backend_tests
        run: |
          pytest tests/ -v --tb=long --junitxml=test-results.xml 2>&1 | tee test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        env:
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test"
          JWT_SECRET: "ci-test-secret-key"
          GEMINI_API_KEY: "fake-key-for-ci"
          AZURE_SEARCH_ENDPOINT: "https://fake.search.windows.net"
          AZURE_SEARCH_API_KEY: "fake-key-for-ci"
          AWS_ACCESS_KEY_ID: "fake"
          AWS_SECRET_ACCESS_KEY: "fake"
          UPSTASH_REDIS_URL: "https://fake.upstash.io"
          UPSTASH_REDIS_TOKEN: "fake"

      - name: 📊 Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: Desarrollo/CACIF/Codigo Fuente/Backend/test-results.xml

  # ═══════════════════════════════════════════════════════════════
  # Frontend: Full Test Suite + Production Build
  # ═══════════════════════════════════════════════════════════════
  frontend-full:
    name: "⚛️ Frontend — Full Test Suite + Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Desarrollo/CACIF/Codigo Fuente/Frontend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📗 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "Desarrollo/CACIF/Codigo Fuente/Frontend/package-lock.json"

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔍 ESLint — Análisis estático
        run: npm run lint

      - name: 🏷️ TypeScript — Verificar tipos
        run: npx tsc --noEmit

      - name: 🧪 Vitest — Tests unitarios
        run: npm run test

      - name: 🏗️ Build de producción
        run: npm run build

  # ═══════════════════════════════════════════════════════════════
  # Comentario con resumen en el PR
  # ═══════════════════════════════════════════════════════════════
  test-summary:
    name: "📋 Resumen de Tests"
    runs-on: ubuntu-latest
    needs: [backend-full, frontend-full]
    if: always()

    steps:
      - name: 💬 Comentar resultado en el PR
        uses: actions/github-script@v7
        with:
          script: |
            const backendResult = '${{ needs.backend-full.result }}';
            const frontendResult = '${{ needs.frontend-full.result }}';

            const statusIcon = (result) => {
              if (result === 'success') return '✅';
              if (result === 'failure') return '❌';
              if (result === 'skipped') return '⏭️';
              return '⚠️';
            };

            const allPassed = backendResult === 'success' && frontendResult === 'success';

            const date = new Date().toLocaleDateString('es-PE', {
              year: 'numeric', month: 'long', day: 'numeric',
              hour: '2-digit', minute: '2-digit', timeZone: 'America/Lima'
            });

            const body = [
              `## 🧪 Reporte de Tests — PR #${context.issue.number}`,
              '',
              `> 📅 ${date}`,
              '',
              '---',
              '',
              '### Resultados',
              '',
              '| Componente | Estado | Pruebas |',
              '|---|---|---|',
              `| 🐍 **Backend** | ${statusIcon(backendResult)} ${backendResult} | Sintaxis Python, Schemas Pydantic, JWT, Config, Health Check, KB CRUD, Auth |`,
              `| ⚛️ **Frontend** | ${statusIcon(frontendResult)} ${frontendResult} | ESLint, TypeScript, Vitest, Build de producción |`,
              '',
              '---',
              '',
              allPassed
                ? '> ✅ **Todos los tests pasaron.** Este PR está listo para revisión de código.'
                : '> ❌ **Algunos tests fallaron.** Revisa los logs de GitHub Actions para más detalles.',
              '',
              '---',
              '<sub>🤖 Bot de Choclicode · CI Pipeline</sub>'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.body.includes('🧪 Reporte de Tests — PR')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
